env_settings:
  frequencies:
    physical: 120
    collect: 120
    save: 60
    video: 60
    eval: 60
    render: 0

  random_texture: false
  sensor_type: gsmini
  optical_backend: taxim

collect_settings:
  save_root_dir: data
  use_seed: true
  episode_num: 110

replay_settings:
  save_root_dir: eval_result
  force_action: false
  max_episodes: 110

observation_settings:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'press_depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true

# clean51 with the reactive insert_hole expert (envs/insert_hole.py TaskCfg): a tilt error of 2-6 deg in the
# alignment, the push stopped when the marker field moves 12 px RMS from its start, and an in-place re-alignment
# from the privileged pose. Saved under data/<task>/reactive51, apart from clean51.
task_overrides:
  tilt_error_deg: [2.0, 6.0]
  monitor_push: true
  contact_trigger_px: 12.0
  correct_on_trigger: true
  retract: 0.0
