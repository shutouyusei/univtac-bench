name: uipc_env
# Build toolchain of the Isaac Sim 4.5 environment on RTX 50-series (sm_120): the upstream
# third_party/TacEx/source/tacex_uipc/libuipc/conda/env.yaml with CUDA 12.4 -> 12.8 (the first
# toolkit that targets sm_120) and GCC 11.4 -> conda-forge GCC/G++ 12 (CUDA 12.8 host compiler).
# Python stays 3.10 as upstream.
channels:
  - https://repo.anaconda.com/pkgs/main
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - cmake=3.26
  - cuda-toolkit=12.8
  - conda-forge::gcc_linux-64=12
  - conda-forge::gxx_linux-64=12
  - conda-forge::ninja
  - conda-forge::pkgconfig
