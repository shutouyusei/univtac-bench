name: uipc_env
# upstream libuipc/conda/env.yaml with CUDA 12.4 -> 12.8 and GCC 11 -> 12 (sm_120 needs CUDA 12.8)
channels:
  - https://repo.anaconda.com/pkgs/main
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - cmake=3.26
  - cuda-toolkit=12.8
  - conda-forge::gcc_linux-64=12
  - conda-forge::gxx_linux-64=12
  - conda-forge::ninja
  - conda-forge::pkgconfig
